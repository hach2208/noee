name: Publier Noéé

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 3 * *'   # le 3 de chaque mois : ventes DVF remises à jour

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Adresse du site
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "NOEE_BASE=/${REPO}/" >> "$GITHUB_ENV"
          echo "NOEE_SITE=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_ENV"
      - name: Ventes DVF et communes
        run: npm run data
      - name: Pages communes et sitemap
        run: npm run pages
      - name: Site final
        run: node scripts/build-site.mjs
      - name: Publier sur la branche gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication du $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
